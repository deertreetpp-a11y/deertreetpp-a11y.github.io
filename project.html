<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — DEAR®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+Thai:wght@400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202608132227">
</head>
<body>

<!-- ===== NAV (brand goes home; the button goes FORWARD to the full list) ===== -->
<nav class="nav pj-nav">
  <a class="nav-brand" href="index.html">
    <span class="nav-logo">✦</span>
    <span class="nav-name">DEAR®</span>
  </a>
  <a href="index.html" class="pj-goback" id="goBack">← <span id="goBackLabel">Back</span></a>
  <a href="projects.html" class="btn btn-green btn-roll">
    <span class="roll"><span id="backLabel">All Projects →</span><span id="backLabel2">All Projects →</span></span>
  </a>
</nav>

<main class="pj-main">
  <h1 class="pj-title" id="pjTitle">—</h1>
  <p class="pj-tagline" id="pjTagline"></p>

  <div class="pj-meta">
    <div><span class="pj-meta-label" data-l="service">Service</span><span class="pj-pill" id="pjService"></span></div>
    <div><span class="pj-meta-label" data-l="client">Client</span><span class="pj-pill" id="pjClient"></span></div>
    <div><span class="pj-meta-label" data-l="year">Year</span><span class="pj-pill" id="pjYear"></span></div>
  </div>

  <div class="pj-media" id="pjMedia"></div>

  <p class="pj-desc" id="pjDesc"></p>

  <!-- evidence that belongs next to the outcome, not up in the gallery -->
  <div class="pj-media pj-proof" id="pjProof"></div>

  <!-- STAR's R: kept in its own block so "how did it end" is never buried in prose -->
  <div class="pj-result" id="pjResult" style="display:none">
    <span class="pj-result-label" id="pjResultLabel">Result</span>
    <p class="pj-result-text" id="pjResultText"></p>
  </div>

  <div class="pj-cta-row">
    <a href="index.html#contact" class="btn btn-white btn-lg btn-roll pj-cta">
      <span class="roll"><span id="ctaLabel">Work with me →</span><span id="ctaLabel2">Work with me →</span></span>
    </a>
    <a href="#" id="pjDownload" class="btn btn-green btn-lg btn-roll pj-cta" style="display:none" download>
      <span class="roll"><span id="dlLabel"></span><span id="dlLabel2"></span></span>
    </a>
    <!-- same slot, but for opening a live site instead of downloading a file -->
    <a href="#" id="pjVisit" class="btn btn-green btn-lg btn-roll pj-cta" style="display:none" target="_blank" rel="noopener">
      <span class="roll"><span id="vsLabel"></span><span id="vsLabel2"></span></span>
    </a>
  </div>
</main>

<script src="project-data.js?v=202608132227"></script>
<script>
(function () {
  const lang = (localStorage.getItem("lang") === "th") ? "th" : "en";
  const slug = new URLSearchParams(location.search).get("p");
  // hasOwn, not a plain lookup: ?p=constructor / __proto__ / toString would
  // otherwise resolve up the prototype chain and render a broken page
  const p = (slug && Object.prototype.hasOwnProperty.call(PROJECT_PAGES, slug))
    ? PROJECT_PAGES[slug] : null;
  if (!p) { location.replace("projects.html"); return; }

  document.title = p.title + " — DEAR®";
  document.getElementById("pjTitle").textContent = p.title;
  document.getElementById("pjTagline").textContent = p.tagline[lang];
  document.getElementById("pjDesc").textContent = p.desc[lang];
  document.getElementById("pjService").textContent = p.service;
  document.getElementById("pjClient").textContent = p.client;
  document.getElementById("pjYear").textContent = p.year;

  const L = {
    th: { service: "บริการ", client: "ลูกค้า/งาน", year: "ปี", back: "ผลงานทั้งหมด →", cta: "ร่วมงานกับผม →", goBack: "ย้อนกลับ" },
    en: { service: "Service", client: "Client", year: "Year", back: "All Projects →", cta: "Work with me →", goBack: "Back" },
  }[lang];
  document.getElementById("goBackLabel").textContent = L.goBack;

  if (p.result) {
    document.getElementById("pjResult").style.display = "";
    document.getElementById("pjResultLabel").textContent = lang === "th" ? "ผลลัพธ์" : "Result";
    document.getElementById("pjResultText").textContent = p.result[lang];
  }

  // go back to wherever they actually came from (ticker or the grid);
  // falls back to the home page when the case page was opened directly
  document.getElementById("goBack").addEventListener("click", e => {
    if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) {
      e.preventDefault();
      history.back();
    }
  });
  document.querySelectorAll(".pj-meta-label").forEach(e => (e.textContent = L[e.dataset.l]));
  document.getElementById("backLabel").textContent = L.back;
  document.getElementById("backLabel2").textContent = L.back;
  document.getElementById("ctaLabel").textContent = L.cta;
  document.getElementById("ctaLabel2").textContent = L.cta;

  if (p.download) {
    const dl = document.getElementById("pjDownload");
    dl.href = p.download.href;
    dl.style.display = "";
    document.getElementById("dlLabel").textContent = p.download.label[lang];
    document.getElementById("dlLabel2").textContent = p.download.label[lang];
  }

  if (p.visit) {
    const vs = document.getElementById("pjVisit");
    vs.href = p.visit.href;
    vs.style.display = "";
    document.getElementById("vsLabel").textContent = p.visit.label[lang];
    document.getElementById("vsLabel2").textContent = p.visit.label[lang];
  }

  const media = document.getElementById("pjMedia");
  if (p.media && p.media.length) {
    const render = (m, mi) => {
      if (typeof m === "string") m = { type: "img", src: m };
      // portrait media marked phone:true sits inside an iPhone mockup on a brand-colored panel
      const phone = el => m.phone
        ? `<div class="pj-phone-wrap" style="background:${p.bg}"><div class="pj-phone">${el}</div></div>`
        : el;
      if (m.type === "row")
        return `<div class="pj-row">${m.items.map(render).join("")}</div>`;
      // optional per-item crop focus for object-fit:cover (e.g. pos:"50% 80%")
      const pos = m.pos ? ` style="object-position:${m.pos}"` : "";
      if (m.type === "img")
        return phone(`<img src="${m.src}" alt="${p.title}" loading="lazy"${pos}>`);
      if (m.type === "video") {
        // sound-toggle videos preload fully so scrubbing works without server range-request support
        const vid = `<video src="${m.src}" playsinline autoplay muted${m.loop === false ? "" : " loop"} preload="${m.sound ? "auto" : "metadata"}"${pos}></video>`;
        return m.sound ? `<div class="pj-video-wrap">${vid}<button class="pj-mute-btn" aria-label="toggle sound">🔇</button><div class="pj-seek"><div class="pj-seek-fill"></div></div></div>` : phone(vid);
      }
      if (m.type === "elements") {
        return `
        <div class="pj-elements">
          <div class="pj-elements-head">${m.heading || "Elements — Higgsfield.ai"}</div>
          <div class="pj-elements-grid">
            ${m.items.map(it => `
              <div class="pj-element">
                <img src="${it.img}" alt="${it.label}" loading="lazy">
                <div class="pj-element-label">${it.label}</div>
                <div class="pj-element-cat">${it.category}</div>
              </div>`).join("")}
          </div>
        </div>`;
      }
      if (m.type === "slides") {
        const srcs = Array.from({ length: m.count }, (_, i) => `${m.base}${String(i + 1).padStart(2, "0")}.jpg`);
        return `
        <div class="pj-slides" data-srcs='${JSON.stringify(srcs)}' data-i="0" id="slides${mi}">
          <img src="${srcs[0]}" alt="${p.title} — slide 1" loading="lazy">
          <button class="pj-sbtn pj-prev" aria-label="previous slide">←</button>
          <button class="pj-sbtn pj-next" aria-label="next slide">→</button>
          <span class="pj-scount">1 / ${srcs.length}</span>
        </div>`;
      }
      return "";
    };
    media.innerHTML = p.media.map(render).join("");

    // same renderer, but these sit down by the result block instead of the gallery
    const proof = document.getElementById("pjProof");
    if (p.proof && p.proof.length) {
      proof.innerHTML = p.proof.map(render).join("");
      // a proof shot is supporting evidence, not the story: if one is missing it
      // drops out quietly rather than leaving a broken-image box above the result
      proof.querySelectorAll("img").forEach(img => {
        img.addEventListener("error", () => {
          const row = img.closest(".pj-row");
          img.remove();
          // a pair that loses one half would sit in a lopsided column — go full width
          if (row && row.children.length === 1) row.style.gridTemplateColumns = "1fr";
          if (!proof.querySelector("img")) proof.innerHTML = "";
        });
      });
    }

    // sound-toggle video: starts muted (autoplay requires it), button unmutes
    document.querySelectorAll(".pj-video-wrap").forEach(wrap => {
      const v = wrap.querySelector("video"), btn = wrap.querySelector(".pj-mute-btn");
      btn.addEventListener("click", () => {
        v.muted = !v.muted;
        btn.textContent = v.muted ? "🔇" : "🔊";
        if (!v.muted) v.play();
      });

      // seek bar: click or drag across the strip to scrub forward/back
      const seek = wrap.querySelector(".pj-seek"), fill = wrap.querySelector(".pj-seek-fill");
      v.addEventListener("timeupdate", () => {
        if (v.duration) fill.style.width = (v.currentTime / v.duration * 100) + "%";
      });
      const seekTo = clientX => {
        const r = seek.getBoundingClientRect();
        const frac = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
        if (v.duration) v.currentTime = frac * v.duration;
      };
      let dragging = false;
      seek.addEventListener("mousedown", e => { dragging = true; seekTo(e.clientX); });
      window.addEventListener("mousemove", e => { if (dragging) seekTo(e.clientX); });
      window.addEventListener("mouseup", () => { dragging = false; });
      seek.addEventListener("touchstart", e => seekTo(e.touches[0].clientX));
      seek.addEventListener("touchmove", e => seekTo(e.touches[0].clientX));
    });

    // slide decks: arrows or a tap on the image flip through the pages
    document.querySelectorAll(".pj-slides").forEach(box => {
      const srcs = JSON.parse(box.dataset.srcs);
      const img = box.querySelector("img"), count = box.querySelector(".pj-scount");
      const go = d => {
        const i = (Number(box.dataset.i) + d + srcs.length) % srcs.length;
        box.dataset.i = i;
        img.src = srcs[i];
        count.textContent = `${i + 1} / ${srcs.length}`;
      };
      box.querySelector(".pj-prev").addEventListener("click", () => go(-1));
      box.querySelector(".pj-next").addEventListener("click", () => go(1));
      img.addEventListener("click", () => go(1));
    });
  } else {
    // branded placeholder until real shots arrive
    media.innerHTML = `<div class="pj-placeholder" style="background:${p.bg}"><span>${p.glyph}</span></div>`;
  }
})();
</script>
</body>
</html>
